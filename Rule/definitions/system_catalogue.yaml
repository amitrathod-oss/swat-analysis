rules:
  - { id: SYS-001, title: Magento Open Source version is unavailable, issue_type: System information, risk_level: High, metric: catalogue.SYS-001.compliant, operator: is_false, expected_result: Magento Open Source version is detected, recommendation: Restore read-only Magento metadata access. }
  - { id: SYS-002, title: Magento release lifecycle requires review, issue_type: Lifecycle, risk_level: High, metric: catalogue.SYS-002.compliant, operator: is_false, expected_result: Magento release is covered by the shipped lifecycle manifest, recommendation: Upgrade to an organization-approved supported Magento release. }
  - { id: SYS-003, title: PHP version is incompatible or end of life, issue_type: PHP, risk_level: Critical, metric: catalogue.SYS-003.compliant, operator: is_false, expected_result: PHP is Magento-compatible and within security support, recommendation: Plan a supported PHP upgrade with Magento compatibility validation. }
  - { id: SYS-004, title: Composer version is incompatible, issue_type: Dependencies, risk_level: Medium, metric: catalogue.SYS-004.compliant, operator: is_false, expected_result: Composer meets the Magento minimum version, recommendation: Upgrade Composer through the normal platform process. }
  - { id: SYS-005, title: Database server version is incompatible, issue_type: Database, risk_level: Critical, metric: catalogue.SYS-005.compliant, operator: is_false, expected_result: Database engine and version are Magento-compatible, recommendation: Migrate to a database version supported by the detected Magento release. }
  - { id: SYS-006, title: Search service is unavailable or incompatible, issue_type: Search, risk_level: High, metric: catalogue.SYS-006.compliant, operator: is_false, expected_result: Configured search service is reachable and compatible, recommendation: Restore search connectivity or use a supported version. }
  - { id: SYS-007, title: Redis or Valkey is unavailable or incompatible, issue_type: Cache service, risk_level: High, metric: catalogue.SYS-007.compliant, operator: is_false, expected_result: Configured cache service is reachable and compatible, recommendation: Restore cache-service connectivity or use a supported version. }
  - { id: SYS-008, title: Web-server version is unavailable, issue_type: Web server, risk_level: Low, metric: catalogue.SYS-008.compliant, operator: is_false, expected_result: A supported web-server binary is detected, recommendation: Provide read-only access to the web-server binary. }
  - { id: SYS-009, title: Operating system is end of life, issue_type: Operating system, risk_level: Medium, metric: catalogue.SYS-009.compliant, operator: is_false, expected_result: Operating system is within lifecycle policy, recommendation: Upgrade the operating system through the infrastructure lifecycle process. }
  - { id: SYS-010, title: Magento module inventory is unavailable, issue_type: Modules, risk_level: Info, metric: catalogue.SYS-010.compliant, operator: is_false, expected_result: Enabled and disabled modules are classified, recommendation: Restore read-only Magento module registration access. }
  - { id: SYS-011, title: Magento deployment mode is unsuitable for production, issue_type: Application mode, risk_level: High, metric: catalogue.SYS-011.compliant, operator: is_false, expected_result: Production mode for a production-targeted scan, recommendation: Switch to production mode through the approved deployment process. }
  - { id: SYS-013, title: Magento cron installation is missing, issue_type: Cron, risk_level: High, metric: catalogue.SYS-013.compliant, operator: is_false, expected_result: A valid Magento cron entry exists, recommendation: Install or restore cron using the normal Magento deployment procedure. }
  - { id: SYS-015, title: One or more indexers are unhealthy, issue_type: Indexers, risk_level: High, metric: catalogue.SYS-015.compliant, operator: is_false, expected_result: No required indexer is invalid or suspended, recommendation: Resolve the affected indexer state and reindex through the approved maintenance process. }
  - { id: SYS-017, title: Magento filesystem permissions require attention, issue_type: Filesystem, risk_level: High, metric: catalogue.SYS-017.compliant, operator: is_false, expected_result: Required directories are writable with no unsafe scripts, recommendation: Correct permissions and ownership using the deployment-user policy. }
  - { id: SYS-018, title: Disk or inode utilization exceeds the warning threshold, issue_type: Capacity, risk_level: High, metric: catalogue.SYS-018.compliant, operator: is_false, expected_result: Disk and inode utilization are below 80 percent, recommendation: Increase capacity or remove approved stale data before service is affected. }
  - { id: SYS-020, title: PHP limits or OPcache require review, issue_type: PHP, risk_level: High, metric: catalogue.SYS-020.compliant, operator: is_false, expected_result: Web PHP has usable limits and OPcache enabled, recommendation: Adjust the web-SAPI PHP policy and verify it after a controlled restart. }
  - id: SEC-004
    title: Unknown custom extension source
    category: Security
    domain: Security
    issue_type: Extensions
    risk_level: High
    metric: catalogue.SEC-004.compliant
    operator: is_false
    expected_result: Enabled custom modules have Composer provenance or an approved exception
    recommendation: Document module ownership and provenance, or add the module through the approved package process.
  - id: SEC-008
    title: Excessive admin role privileges
    category: Security
    domain: Security
    issue_type: Admin accounts
    risk_level: High
    metric: catalogue.SEC-008.compliant
    operator: is_false
    expected_result: Unrestricted admin roles have an explicit policy exception
    recommendation: Apply least privilege or document the approved unrestricted-role exception.
  - id: SEC-010
    title: Admin lockout or session settings are weak
    category: Security
    domain: Security
    issue_type: Magento configuration
    risk_level: High
    metric: catalogue.SEC-010.compliant
    operator: is_false
    expected_result: Lockout and session values are positive and policy-compliant
    recommendation: Set secure admin lockout and session values in the appropriate configuration scope.
  - id: SEC-011
    title: Two-factor authentication module is unavailable
    category: Security
    domain: Security
    issue_type: Admin authentication
    risk_level: High
    metric: catalogue.SEC-011.compliant
    operator: is_false
    expected_result: Magento_TwoFactorAuth is enabled when supported
    recommendation: Enable two-factor authentication or document the approved IAM/SSO control.
  - id: SEC-014
    title: Secure cookies are disabled for HTTPS
    category: Security
    domain: Security
    issue_type: Magento configuration
    risk_level: High
    metric: catalogue.SEC-014.compliant
    operator: is_false
    expected_result: HTTPS scopes use secure cookies
    recommendation: Enable the secure cookie flag at each applicable configuration scope.
  - id: SEC-015
    title: Cookie response attributes require review
    category: Security
    domain: Security
    issue_type: Session security
    risk_level: High
    metric: catalogue.SEC-015.compliant
    operator: is_false
    expected_result: Cookies include HttpOnly and SameSite attributes
    recommendation: Configure the application or edge policy to set HttpOnly and SameSite cookie attributes.
  - id: SEC-019
    title: Debug or developer settings are exposed
    category: Security
    domain: Security
    issue_type: Runtime exposure
    risk_level: High
    metric: catalogue.SEC-019.compliant
    operator: is_false
    expected_result: Production mode has no display_errors or Xdebug exposure
    recommendation: Disable developer diagnostics in production and redeploy through the approved process.
  - id: SEC-020
    title: Public error response discloses sensitive details
    category: Security
    domain: Security
    issue_type: Runtime exposure
    risk_level: High
    metric: catalogue.SEC-020.compliant
    operator: is_false
    expected_result: Missing routes return generic error responses
    recommendation: Disable exception and stack-trace rendering on public error pages.
  - id: SEC-022
    title: Unsafe writable executable script
    category: Security
    domain: Security
    issue_type: Filesystem execution
    risk_level: High
    metric: catalogue.SEC-022.compliant
    operator: is_false
    expected_result: No group- or world-writable PHP or shell script exists in Magento executable paths
    recommendation: Remove writable permissions from executable scripts and validate cron deployment paths.
  - id: SEC-024
    title: Suspicious PHP code indicator
    category: Security
    domain: Security
    issue_type: Malware indicators
    risk_level: High
    metric: catalogue.SEC-024.compliant
    operator: is_false
    expected_result: No unreviewed high-risk execution pattern appears in custom or writable PHP
    recommendation: Review the identified file with the code owner and remove unapproved executable patterns.
  - { id: SEC-025, title: Database user has dangerous global privileges, category: Security, domain: Security, issue_type: Database security, risk_level: High, metric: catalogue.SEC-025.compliant, operator: is_false, expected_result: Magento runtime database user has least privilege, recommendation: Remove global administrative privileges from the Magento database account. }
  - { id: SEC-027, title: Backup or log file is world-readable, category: Security, domain: Security, issue_type: Data protection, risk_level: High, metric: catalogue.SEC-027.compliant, operator: is_false, expected_result: Sensitive backup and log files are not world-readable, recommendation: Restrict file permissions using the approved deployment-user policy. }
  - { id: SEC-029, title: Admin brute-force control is weak, category: Security, domain: Security, issue_type: Access protection, risk_level: High, metric: catalogue.SEC-029.compliant, operator: is_false, expected_result: Admin lockout and rate-limit controls are enabled, recommendation: Configure lockout controls and document WAF or edge rate limiting. }
